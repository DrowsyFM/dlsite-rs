[package]
name = "dlsite"
version = "0.2.0"
edition = "2024"
description = "DLsite client"
repository = "https://github.com/ozonezone/dlsite-rs"
license = "MIT"

[package.metadata.docs.rs]
features = ["document-features"]

[features]
default = ["reqwest-default-tls", "unknown-field-log"]

## Fails when unknown fields are found in response.
unknown-field-error = []
## Outputs log when unknown fields are found in response.
unknown-field-log = ["dep:serde_ignored"]

#! ### Reqwest features
## Enables native-tls feature of reqwest.
reqwest-default-tls = ["reqwest/default-tls"]
## Enables native-tls feature of reqwest.
reqwest-native-tls = ["reqwest/native-tls"]
## Enables rustls-tls feature of reqwest.
# reqwest-rustls-tls = ["reqwest/rustls-tls"]

document-features = ["dep:document-features"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
reqwest = { version = "0.13.5" }
scraper = "0.29.0"
tokio = { version = "1.54.1", features = ["macros"] }

serde = "1.0.229"
serde-aux = "4.7.0"
serde_ignored = { version = "0.1.14", optional = true }
serde_json = "1.0.154"
serde_repr = "0.1.21"
serde_with = { version = "3.25.0", features = ["macros"] }

document-features = { version = "0.2.12", optional = true }
regex = "1.13.2"
strum = { version = "0.28.0", features = ["derive"] }
thiserror = "2.0.21"
tracing = "0.1.44"
url = "2.5.9"

[dev-dependencies]
anyhow = { version = "1.0.105", features = ["backtrace", "std"] }
rand = "0.10.4"
test-case = "3.4.1"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = "0.3.23"
